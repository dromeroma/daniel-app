# ---------------------------------------------------------------------------
# Configuracion de memoria para Gradle.
# Valores conservadores para que la compilacion funcione tambien en equipos
# con poca RAM (8 GB o menos).
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=192m

# El compilador de Kotlin se ejecuta dentro del propio proceso de Gradle
# en lugar de lanzar una segunda maquina virtual de Java.
kotlin.compiler.execution.strategy=in-process

# Sin paralelismo: una sola tarea a la vez consume mucha menos memoria.
org.gradle.parallel=false
org.gradle.workers.max=1

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
